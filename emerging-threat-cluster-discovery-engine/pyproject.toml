[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emerging-threat-cluster-discovery-engine"
version = "0.1.0"
description = "Metadata-only IOC ingestion worker"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "apscheduler>=3.10,<4",
    "httpx>=0.27,<1",
    "networkx>=3.3,<4",
    "pydantic>=2.9,<3",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "typer>=0.12,<1",
]

[project.scripts]
threat-ingest = "threat_ingestion.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "respx>=0.21,<1",
    "ruff>=0.8,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]