title: Potential Credential Dumping Behavior
id: 9c8994d4-2f38-4d78-8a0d-2e9f9875c940
status: experimental
description: Detects suspicious process behavior commonly associated with credential theft.
author: security-lab
date: 2026-08-22
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID:
      - 4656
      - 4663
    ObjectName|contains:
      - 'lsass.exe'
      - 'sam'
  condition: selection
falsepositives:
  - Legitimate admin tools
level: high
